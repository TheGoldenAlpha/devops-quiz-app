apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devops-quiz-frontend
  labels:
    app: devops-quiz
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devops-quiz-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
